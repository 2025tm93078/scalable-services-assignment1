# One Postgres server, one database + one user per service.
# Start: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: ssa1-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata:
