# =============================================================================
# Task 2 — Docker Compose  (Person 2: Priya)
# Start everything:  docker compose up --build
# Stop everything:   docker compose down
# =============================================================================
# Architecture
#   postgres        – shared Postgres 16 instance (one DB + one user per service)
#   inventory       – port 3001
#   order           – port 3002  (calls inventory, payment, notification)
#   payment         – port 3003  (calls mock-gateway)
#   notification    – port 3004
#   mock-gateway    – port 3005  (simulated payment provider)
#   catalog         – port 3006
#
# All service-to-service URLs use Docker's internal DNS (container names), NOT
# localhost — this is the key difference from a local dev .env file.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Database — shared Postgres, one database + one user per service
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ssa1-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql creates all per-service databases and users on first start
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mock Payment Gateway  (no DB — starts immediately)
  # ---------------------------------------------------------------------------
  mock-gateway:
    build:
      context: ./services/mock-gateway
      dockerfile: Dockerfile
    container_name: ssa1-mock-gateway
    environment:
      PORT: "3005"
      LATENCY_MS: "300"   # simulated provider latency in ms
      FAIL_RATE: "0"       # 0 = no random declines (deterministic demo)
      LOG_LEVEL: "info"
    ports:
      - "3005:3005"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3005/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Inventory Service  (Dockerfile written by Person 1 — not modified here)
  # ---------------------------------------------------------------------------
  inventory:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    container_name: ssa1-inventory
    environment:
      PORT: "3001"
      # DB host = container name "postgres", NOT localhost
      DATABASE_URL: "postgres://inventory_user:inventory_pass@postgres:5432/inventory_db"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy   # waits until pg_isready succeeds
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Payment Service
  # ---------------------------------------------------------------------------
  payment:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: ssa1-payment
    environment:
      PORT: "3003"
      DATABASE_URL: "postgres://payment_user:payment_pass@postgres:5432/payment_db"
      GATEWAY_URL: "http://mock-gateway:3005"   # container name, not localhost
      GATEWAY_TIMEOUT_MS: "4000"
      IDEMPOTENCY_WAIT_MS: "5000"
      LOG_LEVEL: "info"
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      mock-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Notification Service
  # ---------------------------------------------------------------------------
  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: ssa1-notification
    environment:
      PORT: "3004"
      DATABASE_URL: "postgres://notification_user:notification_pass@postgres:5432/notification_db"
      LOG_LEVEL: "info"
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3004/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Order Service — orchestrates the checkout saga
  # Calls: inventory → reserve stock  |  payment → charge card  |  notification → send email
  # Must wait for all three upstream services to be healthy before starting.
  # ---------------------------------------------------------------------------
  order:
    build:
      context: ./services/order
      dockerfile: Dockerfile
    container_name: ssa1-order
    environment:
      PORT: "3002"
      DATABASE_URL: "postgres://order_user:order_pass@postgres:5432/order_db"
      # All URLs use Docker internal DNS (container names), never localhost
      INVENTORY_URL: "http://inventory:3001"
      PAYMENT_URL: "http://payment:3003"
      NOTIFICATION_URL: "http://notification:3004"
      SERVICE_TIMEOUT_MS: "5000"
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
      notification:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Catalog Service  (Dockerfile written by Person 4 — not modified here)
  # ---------------------------------------------------------------------------
  catalog:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    container_name: ssa1-catalog
    environment:
      PORT: "3006"
      DATABASE_URL: "postgres://catalog_user:catalog_pass@postgres:5432/catalog_db"
      LOG_LEVEL: "info"
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3006/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

# =============================================================================
# Named volumes — persisted data survives docker compose down
# =============================================================================
volumes:
  pgdata:
    driver: local
