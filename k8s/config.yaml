apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Internal Kubernetes DNS names are used instead of localhost
  DATABASE_URL_INVENTORY: "postgres://inventory_user:inventory_pass@postgres:5432/inventory_db"
  DATABASE_URL_ORDER: "postgres://order_user:order_pass@postgres:5432/order_db"
  DATABASE_URL_PAYMENT: "postgres://payment_user:payment_pass@postgres:5432/payment_db"
  DATABASE_URL_NOTIFICATION: "postgres://notification_user:notification_pass@postgres:5432/notification_db"
  DATABASE_URL_CATALOG: "postgres://catalog_user:catalog_pass@postgres:5432/catalog_db"
  INVENTORY_URL: "http://inventory:3001"
  PAYMENT_URL: "http://payment:3003"
  NOTIFICATION_URL: "http://notification:3004"
  GATEWAY_URL: "http://mock-gateway:3005"
  LATENCY_MS: "0"
  FAIL_RATE: "0"