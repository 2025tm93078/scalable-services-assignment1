openapi: 3.0.0
info:
  title: Catalog Service API
  version: 1.0.0
  description: Manages the product catalog and enforces pricing/category rules.
paths:
  /api/v1/catalog:
    get:
      summary: List all products
      responses:
        '200':
          description: A list of products
    post:
      summary: Add a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, category]
              properties:
                name:
                  type: string
                  example: "Wireless Mouse"
                description:
                  type: string
                price:
                  type: number
                  example: 25.99
                category:
                  type: string
                  enum: [Electronics, Clothing, Books]
      responses:
        '201':
          description: Product successfully created
        '400':
          description: Validation error (BR7 or BR8 violation)